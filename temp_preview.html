<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minutário</title>
  <style>:root {
  --tjpr-navy-900: #0d1b2a;
  --tjpr-navy-800: #1b263b;
  --tjpr-navy-700: #415a77;
  --tjpr-gold: #d4af37;
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-500: #64748b;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --text: #0f172a;
  --surface: #ffffff;
  --shadow-lg: 0 18px 45px rgba(13, 27, 42, 0.2);
  --shadow-md: 0 10px 24px rgba(13, 27, 42, 0.12);
  --status-ready: #10b981;
  --status-offline: #f43f5e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 320px;
  padding: 14px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 14% 8%, rgba(212, 175, 55, 0.22), transparent 28%),
    linear-gradient(135deg, var(--tjpr-navy-900) 0%, var(--tjpr-navy-800) 56%, var(--tjpr-navy-700) 100%);
  -webkit-font-smoothing: antialiased;
}

.popup-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 92px;
  padding: 16px 14px 18px;
  color: #ffffff;
  border-radius: 16px 16px 10px 10px;
  box-shadow: var(--shadow-lg);
}

.brand-mark {
  display: grid;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  place-items: center;
  border: 1px solid rgba(212, 175, 55, 0.48);
  border-radius: 14px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
  color: #f5d66d;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.04em;
}

.eyebrow {
  margin: 0 0 3px;
  color: #d7e2ee;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: #ffffff;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.1;
}

.subtitle {
  margin: 5px 0 0;
  color: rgba(248, 250, 252, 0.86);
  font-size: 12px;
  line-height: 1.35;
}

.popup-card {
  margin-top: -8px;
  padding: 16px 14px;
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
}

.user-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--slate-100);
}

.user-status-wrapper {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--status-ready);
}

.user-email {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-800);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}

.sync-status {
  font-size: 11px;
  color: var(--slate-500);
  font-weight: 500;
  background: var(--slate-100);
  padding: 3px 8px;
  border-radius: 12px;
}

.action-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.secondary-actions {
  display: flex;
  gap: 8px;
}

#login-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.input-group label {
  font-size: 11px;
  font-weight: 600;
  color: var(--slate-700);
}

.input-group input {
  padding: 10px 12px;
  border: 1px solid var(--slate-200);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  transition: border-color 150ms ease, box-shadow 150ms ease;
}

.input-group input:focus {
  outline: none;
  border-color: var(--tjpr-gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.error-message {
  color: var(--status-offline);
  font-size: 11px;
  font-weight: 500;
  text-align: center;
}

.btn-primary {
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--tjpr-navy-800);
  color: #ffffff;
  box-shadow: 0 8px 18px rgba(27, 38, 59, 0.18);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 12px;
  cursor: pointer;
  transition: transform 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
}

.btn-primary:hover {
  background: var(--tjpr-navy-700);
  box-shadow: 0 10px 22px rgba(27, 38, 59, 0.24);
  transform: translateY(-1px);
}

.btn-secondary {
  flex: 1;
  border: 1px solid var(--slate-200);
  border-radius: 8px;
  background: #ffffff;
  color: var(--slate-700);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 9px;
  cursor: pointer;
  transition: all 150ms ease;
}

.btn-secondary:hover {
  background: var(--slate-50);
  border-color: var(--slate-500);
  color: var(--tjpr-navy-900);
}

.btn-primary:active, .btn-secondary:active {
  transform: translateY(0);
}

.btn-primary:focus-visible, .btn-secondary:focus-visible, .recent-item:focus-visible {
  outline: 3px solid rgba(212, 175, 55, 0.36);
  outline-offset: 2px;
}

.recentes {
  margin-top: 18px;
}

.recentes h2 {
  margin: 0 0 10px;
  color: var(--slate-700);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

#recent-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 44px;
}

.recent-item {
  width: 100%;
  text-align: left;
  padding: 10px 11px;
  border: 1px solid var(--slate-200);
  border-left: 3px solid var(--tjpr-gold);
  border-radius: 8px;
  background: linear-gradient(180deg, #ffffff 0%, var(--slate-50) 100%);
  color: var(--text);
  font-family: inherit;
  cursor: pointer;
  transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
}

.recent-item:hover {
  border-color: rgba(65, 90, 119, 0.42);
  background: #ffffff;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  transform: translateY(-1px);
}

.recent-name {
  display: block;
  color: var(--slate-800);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;
}

.recent-shortcut {
  display: block;
  margin-top: 4px;
  color: var(--tjpr-navy-700);
  font-size: 11px;
  font-weight: 600;
}

.empty-state {
  margin: 0;
  padding: 12px;
  text-align: center;
  border: 1px dashed var(--slate-200);
  border-radius: 8px;
  background: var(--slate-50);
  color: var(--slate-700);
  font-size: 12px;
  line-height: 1.4;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
  padding: 0 4px;
  text-align: center;
  color: rgba(248, 250, 252, 0.78);
  font-size: 10px;
  font-weight: 500;
}
</style>
</head>
<body>
  <header class="popup-hero">
    <div class="brand-mark" aria-hidden="true">M</div>
    <div>
      <p class="eyebrow">Biblioteca de minutas</p>
      <h1>Minutário</h1>
      <p class="subtitle">Minutas rápidas para Word Online</p>
    </div>
  </header>

  <!-- Login Section -->
  <section id="login-section" class="popup-card" style="display: flex;">
    <form id="login-form">
      <div class="input-group">
        <label for="login-email">E-mail ou Usuário</label>
        <input type="text" id="login-email" placeholder="usuario ou usuario@tjpr.jus.br" required />
      </div>
      <div class="input-group">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="Sua senha" required />
      </div>
      <div id="login-error" class="error-message" style="display: none;"></div>
      <button type="submit" id="login-submit" class="btn-primary">Entrar</button>
    </form>
  </section>

  <!-- Logged-in Section -->
  <section id="dashboard-section" class="popup-card" style="display: none;">
    <div class="user-info">
      <div class="user-status-wrapper">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="user-email" class="user-email">Carregando...</span>
      </div>
      <span id="sync-status" class="sync-status">Pronto</span>
    </div>

    <div class="action-buttons">
      <div class="secondary-actions">
        <button id="open-quick-access" class="btn-primary" type="button">Consulta Rápida</button>
        <button id="force-sync" class="btn-secondary" type="button">Sincronizar</button>
      </div>
      <button id="logout-btn" class="btn-secondary" style="margin-top: 10px;" type="button">Sair</button>
    </div>

    <section class="recentes" aria-labelledby="recentes-label">
      <h2 id="recentes-label">Minutas Recentes</h2>
      <div id="recent-list"></div>
    </section>
  </section>

  <footer>
    <span>v1.2.0</span>
    <span>Desenvolvido por Elvertoni Coimbra</span>
  </footer>

  <script src="../shared/config.js"></script>
  <script src="../lib/supabase.min.js"></script>
  <script src="../shared/browser-compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
