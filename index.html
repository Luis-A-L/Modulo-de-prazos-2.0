<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Prazos - P-SEP-AR - TJPR</title>
    <meta name="description" content="Módulo de cálculo de prazos processuais, triagem IA e minutário do TJPR - P-SEP-AR">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="Logo.png">
    <link rel="manifest" href="manifest.json">

    <script>
        // Inicialização imediata do tema para evitar FOUC
        (function() {
            const savedSettings = localStorage.getItem('appSettings');
            const theme = savedSettings ? JSON.parse(savedSettings).theme : 'system';
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prazos TJPR">
    <link rel="apple-touch-icon" href="Logo.png">

    <!-- Google Material Icons & Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=17">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'tjpr-navy': {
                            900: '#0D1B2A',
                            800: '#1B263B',
                            700: '#415A77',
                            600: '#778DA9',
                            500: '#90A9C9',
                        },
                        'tjpr-gold': '#D4AF37',
                        'tjpr-success': '#2E7D32',
                        'tjpr-warning': '#F57C00',
                        'tjpr-error': '#C62828',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- React 18 — Modo Produção -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React Image Crop -->
    <link rel="stylesheet" href="https://unpkg.com/react-image-crop/dist/ReactCrop.css" />
    <script src="https://unpkg.com/react-image-crop/dist/ReactCrop.umd.js"></script>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Chart.js e SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@2.11.2/dist/react-chartjs-2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- html2canvas para exportação PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- jsPDF para exportação PDF da Ficha -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- OCR Libraries for TriagemIA -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>

</head>

<body
    class="tjpr-bg-main tjpr-text-main overflow-hidden font-sans antialiased selection:bg-blue-500 selection:text-white">
    <!-- 
        A classe `overflow-hidden` no body impede a barra de rolagem do navegador,
        deixando o controle de rolagem para o componente React.
    -->
    <div id="root"></div>

    <!-- Supabase: init -->
    <script src="supabase-init.js?v=17"></script>
    <script src="contexts.js?v=17" type="text/babel"></script>
    <script src="utils.js?v=17" type="text/babel"></script>
    <script src="regrasCNJ.js?v=17" type="text/babel"></script>
    <script src="regrasCrime.js?v=17" type="text/babel"></script>
    <script src="regrasCivel.js?v=17" type="text/babel"></script>
    <script src="minutas-default.js?v=17" type="text/babel"></script>
    <script src="MinutaPreparoAdminPage.js?v=17" type="text/babel"></script>
    <script src="MinutasAdminPage.js?v=17" type="text/babel"></script>
    <script src="MinutaPreparoFlow.js?v=17" type="text/babel"></script>
    <script src="MinutaPreparoPage.js?v=17" type="text/babel"></script>
    <script src="CalendarAdminPage.js?v=17" type="text/babel"></script>
    <script src="BugReportsPage.js?v=17" type="text/babel"></script>
    <script src="AgentStudioAdminPage.js?v=17" type="text/babel"></script>
    <script src="TriagemIAPage.js?v=17" type="text/babel"></script>
    <script src="MinutarioPage.js?v=17" type="text/babel"></script>

    <!-- Componentes do Design System TJPR -->
    <script src="components.js?v=17" type="text/babel"></script>
    <script src="login.js?v=17" type="text/babel"></script>

    <script src="app.js?v=17" type="text/babel"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registrado: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('Falha no registro do SW: ', err);
                    });
            });
        }
    </script>
</body>

</html>
