<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minutário</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>

  <!-- Cabeçalho da Extensão -->
  <header class="popup-hero">
    <div class="brand-mark">M</div>
    <div class="hero-content">
      <p class="eyebrow">Biblioteca de Minutas</p>
      <h1>Minutário</h1>
      <p class="subtitle">Expansão de texto inteligente</p>
    </div>
  </header>

  <!-- Tela de Login -->
  <section id="login-section" class="popup-card" style="display: none;">
    <div class="login-title">
      <h2>Acesso ao Minutário</h2>
      <p>Utilize sua conta TJPR</p>
    </div>

    <form id="login-form">
      <div class="input-group">
        <label for="login-email">E-mail ou Usuário</label>
        <div class="input-with-icon">
          <span class="material-symbols-rounded">person</span>
          <input type="text" id="login-email" placeholder="usuario@tjpr.jus.br" required />
        </div>
      </div>

      <div class="input-group">
        <label for="login-password">Senha</label>
        <div class="password-wrapper">
          <span class="material-symbols-rounded">lock</span>
          <input type="password" id="login-password" placeholder="Sua senha" required />
          <button type="button" id="toggle-password" class="btn-toggle-password" aria-label="Mostrar senha">
            <span class="material-symbols-rounded">visibility</span>
          </button>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="save-login-check" checked />
        <span>Lembrar login</span>
      </label>

      <div id="login-error" class="error-message" style="display: none;"></div>

      <div class="btn-entrar-wrap">
        <button type="submit" id="login-submit" class="btn-entrar">
          <span class="material-symbols-rounded">login</span>
          Entrar
        </button>
      </div>
    </form>
  </section>

  <!-- Tela de Dashboard (logado) -->
  <section id="dashboard-section" class="popup-card" style="display: none;">
    <div class="user-info-bar">
      <div class="user-status">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="user-email" class="user-email-text">Carregando...</span>
      </div>
      <span id="sync-status" class="status-badge">Pronto</span>
    </div>

    <div class="dashboard-grid">
      <button id="open-quick-access" class="btn-action primary" type="button">
        <span class="material-symbols-rounded">manage_search</span>
        <span>Consulta Rápida</span>
      </button>
      <button id="force-sync" class="btn-action secondary" type="button">
        <span class="material-symbols-rounded">sync</span>
        <span>Sincronizar</span>
      </button>
    </div>



    <div class="dashboard-footer-actions">
      <button id="logout-link-btn" class="btn-text-action" type="button">
        <span class="material-symbols-rounded">logout</span>
        Desconectar
      </button>
    </div>
  </section>

  <footer>
    <span>v1.2.0</span>
    <span>Desenvolvido por Elvertoni Coimbra</span>
  </footer>

  <script src="../shared/config.js"></script>
  <script src="../lib/supabase.min.js"></script>
  <script src="../shared/browser-compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
